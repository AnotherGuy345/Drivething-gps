<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DriveThing GPS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .top {
  padding: 12px 15px;
  background: #1c1c1c;
  text-align: center;
  border-bottom: 2px solid #333;
}

    .top h1 {
      margin: 0;
      font-size: 26px;
    }

    .status {
      margin-top: 5px;
      color: #aaa;
    }

    #nextTurn {
  background: #1c1c1c;
  color: white;
  padding: 22px;
  font-size: 26px;
  font-weight: bold;
  text-align: left;
  border-radius: 12px;
  margin: 10px;
  line-height: 1.3;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

    #routeInfo {
  background: #222;
  color: white;
  padding: 14px;
  margin: 10px;
  border-radius: 12px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  line-height: 1.3;
}

    #map {
  height: 60vh;
  min-height: 350px;
  width: 100%;
}

    .controls {
  padding: 12px;
  background: #1c1c1c;
  border-top: 2px solid #333;
}
    input {
  width: 100%;
  padding: 17px;
  margin-bottom: 12px;
  font-size: 19px;
  font-weight: bold;
  border-radius: 12px;
  border: none;
  min-height: 56px;
}
    .leaflet-popup-content {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.3;
}

    button {
  width: 100%;
  padding: 17px;
  margin-bottom: 12px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  background: white;
  color: #111;
  min-height: 56px;
}

    .location {
  margin-top: 6px;
  padding: 8px 10px;
  color: #aaa;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.3;
  border-radius: 8px;
}
    body.light-mode {
      background: #f2f2f2;
      color: #111;
    }

    body.light-mode .top,
    body.light-mode .controls {
      background: white;
      color: #111;
    }

    body.light-mode #nextTurn {
  background: white !important;
  color: #111 !important;
  border: 1px solid #ccc;
}

body.light-mode #routeInfo {
  background: #eee !important;
  color: #111 !important;
  border: 1px solid #ccc;
}
    body.light-mode .status,
    body.light-mode .location {
      color: #555;
    }

  </style>

</head>

<body>

  <div class="top">

    <h1 style="
  font-size:30px;
  margin:0;
  font-weight:bold;
">
  🚗 DriveThing GPS
</h1>

    <div class="status" style="
  font-size:16px;
  font-weight:bold;
  margin-top:7px;
">
  BridgeThing Navigation
</div>


  <div id="nextTurn" style="
  background:#1c1c1c;
  color:white;
  padding:20px;
  font-size:26px;
  font-weight:bold;
  text-align:center;
  line-height:1.3;
">
  🧭 Next turn will appear here
</div>


  <div id="routeInfo" style="
  background:#222;
  color:white;
  padding:14px;
  margin:10px;
  border-radius:10px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  line-height:1.3;
">
  Route information will appear here
</div>


  <div id="map"></div>


  <div class="controls">

    <input
  id="destination"
  type="text"
  placeholder="🔎 Enter destination"
  style="
    font-size:19px;
    padding:17px;
    border-radius:10px;
  "
>
    <button id="searchButton" style="
  font-size:20px;
  font-weight:bold;
  padding:18px;
">
  🔎 Search Destination
</button>
    <button id="gpsButton" style="
  font-size:20px;
  font-weight:bold;
  padding:18px;
">
  📍 Get My Location
</button>

    <button id="themeButton" style="
  font-size:18px;
  font-weight:bold;
  padding:17px;
">
  ☀️ Light / 🌙 Dark
</button>
    <button id="voiceButton" style="
  font-size:18px;
  font-weight:bold;
  padding:17px;
">
  🔊 Voice Guidance: OFF
</button>
    
  <button id="rerouteButton" style="
  font-size:18px;
  font-weight:bold;
  padding:17px;
">
  🔄 Auto Reroute: ON
</button>  
   <button id="recalculateButton" style="
  font-size:18px;
  font-weight:bold;
  padding:17px;
">
  🧭 Recalculate Route
</button>

    <div
      class="location"
      id="location"
    >
      GPS location not available yet.
    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    /* MAP */

    const map =
      L.map("map").setView(
        [35.2271, -80.8431],
        10
      );


    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* VARIABLES */

    let currentMarker = null;

    let destinationMarker = null;
    let destinationLatitude = null;
let destinationLongitude = null;

    let routeLine = null;

    let currentLatitude = null;

    let currentLongitude = null;

    let watchId = null;

    let routeSteps = [];
    let routeCoordinates = [];
    let offRouteCount = 0;
let lastRerouteTime = 0;
    let lastSpokenStep = -1;

    let currentStepIndex = 0;
    let autoReroute = true;
let lastRouteLatitude = null;
let lastRouteLongitude = null;


    /* PAGE ELEMENTS */

    const gpsButton =
      document.getElementById("gpsButton");

    const searchButton =
      document.getElementById("searchButton");

    const themeButton =
      document.getElementById("themeButton");

    const destinationInput =
      document.getElementById("destination");
    const recalculateButton =
  document.getElementById("recalculateButton");

recalculateButton.addEventListener(
  "click",
  function () {

    if (
      currentLatitude === null ||
      currentLongitude === null
    ) {

      locationText.textContent =
        "First tap Get My Location.";

      return;

    }

    if (
      destinationLatitude === null ||
      destinationLongitude === null
    ) {

      locationText.textContent =
        "Choose a destination first.";

      return;

    }

    if (routeLine) {

      map.removeLayer(routeLine);

      routeLine = null;

    }

    locationText.textContent =
      "🔄 Recalculating route...";

    drawRoute(
      destinationLatitude,
      destinationLongitude
    );

  }
);



    

    const locationText =
      document.getElementById("location");

    const nextTurn =
      document.getElementById("nextTurn");

    const routeInfo =
      document.getElementById("routeInfo");


    /* THEME */

    themeButton.addEventListener(
      "click",
      function () {

        document.body.classList.toggle(
          "light-mode"
        );

      }
    );


    /* GPS BUTTON */

    gpsButton.addEventListener(
      "click",
      function () {

        getLocation();

      }
    );


    /* GET LOCATION */

    function getLocation() {

      if (!navigator.geolocation) {

        locationText.textContent =
          "GPS is not supported.";

        return;

      }


      locationText.textContent =
        "Finding your location...";


      navigator.geolocation.getCurrentPosition(

        function (position) {

          currentLatitude =
            position.coords.latitude;

          currentLongitude =
            position.coords.longitude;
map.setView(
  [currentLatitude, currentLongitude],
  17
);

          if (currentMarker) {

            map.removeLayer(
              currentMarker
            );

          }


          currentMarker =
  L.marker(
    [
      currentLatitude,
      currentLongitude
    ],
    {
      icon: L.divIcon({
        className: "car-marker",
        html: "🚗➤",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      })
    }
  )
  .addTo(map)
  .bindPopup(
    "You are here"
  );


          map.setView(
            [
              currentLatitude,
              currentLongitude
            ],
            15
          );


          locationText.textContent =
            "GPS location found.";


          startLiveGPS();

        },


        function (error) {

          locationText.textContent =
            "GPS error: " +
            error.message;

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /* LIVE GPS */

    function startLiveGPS() {

      if (!navigator.geolocation) {
        return;
      }


      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

      }


      watchId =
        navigator.geolocation.watchPosition(

          function (position) {

            currentLatitude =
              position.coords.latitude;

            currentLongitude =
              position.coords.longitude;
            checkNextTurn();
checkActualRoute();
checkArrival();


            if (currentMarker) {

              map.removeLayer(
                currentMarker
              );

            }


            currentMarker =
              L.marker([
                currentLatitude,
                currentLongitude
              ])
              .addTo(map)
              .bindPopup(
                "You are here"
              );

          },


          function (error) {

            locationText.textContent =
              "Live GPS error: " +
              error.message;

          },


          {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 10000
          }

        );

    }


    /* SEARCH DESTINATION */

    searchButton.addEventListener(
      "click",
      async function () {

        const destination =
          destinationInput.value.trim();


        if (!destination) {

          locationText.textContent =
            "Please enter a destination.";

          return;

        }


        locationText.textContent =
          "Searching for " +
          destination +
          "...";


        try {

          const response =
            await fetch(
              "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
              encodeURIComponent(
                destination
              )
            );


          const results =
            await response.json();


          if (results.length === 0) {

            locationText.textContent =
              "Destination not found.";

            return;

          }


          const place =
            results[0];


          const latitude =
            parseFloat(place.lat);

          const longitude =
            parseFloat(place.lon);


          map.setView(
            [
              latitude,
              longitude
            ],
            15
          );


          if (destinationMarker) {

            map.removeLayer(
              destinationMarker
            );

          }


          destinationLatitude =
  latitude;

destinationLongitude =
  longitude;
          destinationMarker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map)
            .bindPopup(
              place.display_name
            )
            .openPopup();


          drawRoute(
            latitude,
            longitude
          );


        }

        catch (error) {

          locationText.textContent =
            "Search failed.";

        }

      }
    );


    /* DRAW ROUTE */

    async function drawRoute(
      destinationLatitude,
      destinationLongitude
    ) {


      if (
        currentLatitude === null ||
        currentLongitude === null
      ) {

        locationText.textContent =
          "First tap Get My Location.";

        return;

      }


      locationText.textContent =
        "Calculating route...";


      const routeURL =
        "https://router.project-osrm.org/route/v1/driving/" +
        currentLongitude +
        "," +
        currentLatitude +
        ";" +
        destinationLongitude +
        "," +
        destinationLatitude +
        "?overview=full&geometries=geojson&steps=true";


      try {

        const response =
          await fetch(routeURL);


        const data =
          await response.json();


        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          locationText.textContent =
            "No driving route found.";

          return;

        }


        const route =
          data.routes[0];
        routeCoordinates =
  route.geometry.coordinates;
        lastRouteLatitude =
  currentLatitude;

lastRouteLongitude =
  currentLongitude;


        routeSteps =
          route.legs[0].steps;


        currentStepIndex = 0;
        lastSpokenStep = -1;


        /* ROUTE LINE */

        if (routeLine) {

          map.removeLayer(
            routeLine
          );

        }


        routeLine =
  L.geoJSON(
    route.geometry,
    {
      style: {
        weight: 7,
        opacity: 0.9
      }
    }
  ).addTo(map);


        map.setView(
  [currentLatitude, currentLongitude],
  17
);


        /* ROUTE INFO */

        const miles =
          (
            route.distance /
            1609.34
          ).toFixed(1);


        const minutes =
          Math.round(
            route.duration / 60
          );


        routeInfo.textContent =
          miles +
          " mi • " +
          minutes +
          " min";


        /* NEXT TURN */

        showNextTurn();
        if (voiceEnabled && routeSteps.length > 0) {

  const firstStep = routeSteps[0];

  const firstDistanceFeet =
    Math.round(firstStep.distance * 3.28084);

  speak(
    "Starting navigation. " +
    getInstructionText(firstStep) +
    " in " +
    firstDistanceFeet +
    " feet."
  );

  lastSpokenStep = 0;
}


        locationText.textContent =
          "Route ready.";

      }


      catch (error) {

        locationText.textContent =
          "Unable to calculate route.";

      }

    }


    /* NEXT TURN */

    function showNextTurn() {

      if (
        !routeSteps ||
        routeSteps.length === 0
      ) {

        nextTurn.textContent =
          "🧭 Continue on route";

        return;

      }


      const step =
        routeSteps[
          currentStepIndex
        ];


      const maneuver =
        step.maneuver;


      let instruction =
        "Continue";


      if (
        maneuver.type === "turn"
      ) {

        instruction =
          "Turn " +
          (maneuver.modifier || "") +
          " onto " +
          (step.name ||
            "the road");

      }


      else if (
        maneuver.type === "depart"
      ) {

        instruction =
          "Start on " +
          (step.name ||
            "the road");

      }


      else if (
        maneuver.type === "arrive"
      ) {

        instruction =
          "You have arrived";

      }


      else if (
        maneuver.type === "roundabout"
      ) {

        instruction =
          "Enter the roundabout";

      }


      const distanceFeet =
        step.distance *
        3.28084;


      let distanceText;


      if (distanceFeet >= 5280) {

        distanceText =
          (
            distanceFeet /
            5280
          ).toFixed(1) +
          " mi";

      }

      else {

        distanceText =
          Math.round(
            distanceFeet
          ) +
          " ft";

      }


      nextTurn.innerHTML =
        "🧭 " +
        instruction +
        "<br>" +
        "<span style='font-size:16px;font-weight:normal;'>" +
        distanceText +
        " to next maneuver" +
        "</span>";

    }

  function checkNextTurn() {

  if (
    !routeSteps ||
    routeSteps.length === 0 ||
    currentLatitude === null ||
    currentLongitude === null
  ) {
    return;
  }

  const step =
    routeSteps[currentStepIndex];

  if (!step) {
    return;
  }

  const turnLatitude =
    step.maneuver.location[1];

  const turnLongitude =
    step.maneuver.location[0];

  const distance =
    getDistanceFeet(
      currentLatitude,
      currentLongitude,
      turnLatitude,
      turnLongitude
    );

  let instruction =
    getInstructionText(step);

  if (distance < 100) {

    if (
      currentStepIndex <
      routeSteps.length - 1
    ) {

      currentStepIndex++;

      showNextTurn();

      const nextStep =
        routeSteps[currentStepIndex];

      if (
        voiceEnabled &&
        lastSpokenStep !== currentStepIndex
      ) {

        const nextDistanceFeet =
          Math.round(
            nextStep.distance * 3.28084
          );

        speak(
          getInstructionText(nextStep) +
          " in " +
          nextDistanceFeet +
          " feet."
        );

        lastSpokenStep =
          currentStepIndex;
      }

    }

    return;
  }

  let distanceText;

  if (distance >= 5280) {

    distanceText =
      (
        distance / 5280
      ).toFixed(1) +
      " mi";

  } else {

    distanceText =
      Math.round(distance) +
      " ft";

  }

  nextTurn.innerHTML =
    "🧭 " +
    instruction +
    "<br>" +
    "<span style='font-size:16px;font-weight:normal;'>" +
    distanceText +
    " to next maneuver" +
    "</span>";

}

function checkArrival() {

  if (
    destinationLatitude === null ||
    destinationLongitude === null ||
    currentLatitude === null ||
    currentLongitude === null
  ) {
    return;
  }

  const distance =
    getDistanceFeet(
      currentLatitude,
      currentLongitude,
      destinationLatitude,
      destinationLongitude
    );

  if (distance <= 150) {

    nextTurn.textContent =
      "🏁 You have arrived!";

    routeInfo.textContent =
      "Destination reached.";

    locationText.textContent =
      "🏁 You have arrived.";

    if (voiceEnabled) {
      speak("You have arrived.");
    }

    currentStepIndex =
      routeSteps.length;

  }

}
function getDistanceFeet(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 20902260;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +
    Math.cos(
      lat1 * Math.PI / 180
    ) *
    Math.cos(
      lat2 * Math.PI / 180
    ) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}
 let voiceEnabled = false;

const voiceButton =
  document.getElementById("voiceButton");
    const rerouteButton =
  document.getElementById("rerouteButton");

rerouteButton.addEventListener(
  "click",
  function () {

    autoReroute =
      !autoReroute;

    if (autoReroute) {

      rerouteButton.textContent =
        "🔄 Auto Reroute: ON";

    } else {

      rerouteButton.textContent =
        "⏸️ Auto Reroute: OFF";

    }

  }
);

voiceButton.addEventListener(
  "click",
  function () {

    voiceEnabled =
      !voiceEnabled;

    if (voiceEnabled) {

      voiceButton.textContent =
        "🔊 Voice Guidance: ON";

      speak("Voice guidance enabled.");

    } else {

      voiceButton.textContent =
        "🔇 Voice Guidance: OFF";

      speechSynthesis.cancel();

    }

  }
);


function speak(text) {

  if (!voiceEnabled) {
    return;
  }

  speechSynthesis.cancel();

  const message =
    new SpeechSynthesisUtterance(text);

  message.rate = 0.9;
  message.pitch = 1;

  speechSynthesis.speak(
    message
  );

} function getInstructionText(step) {

  const maneuver = step.maneuver;

  if (maneuver.type === "turn") {
    return "Turn " +
      (maneuver.modifier || "") +
      " onto " +
      (step.name || "the road");
  }

  if (maneuver.type === "depart") {
    return "Start on " +
      (step.name || "the road");
  }

  if (maneuver.type === "arrive") {
    return "You have arrived";
  }

  if (maneuver.type === "roundabout") {
    return "Enter the roundabout";
  }

  return "Continue on route";
} 
  
 

 function checkActualRoute() {

  if (!autoReroute) {
    return;
  }

  if (
    !routeCoordinates ||
    routeCoordinates.length === 0 ||
    currentLatitude === null ||
    currentLongitude === null
  ) {
    return;
  }

  let closestDistance = Infinity;

  for (const point of routeCoordinates) {

    const routeLongitude = point[0];
    const routeLatitude = point[1];

    const distance = getDistanceFeet(
      currentLatitude,
      currentLongitude,
      routeLatitude,
      routeLongitude
    );

    if (distance < closestDistance) {
      closestDistance = distance;
    }
  }

  if (closestDistance > 500) {

  offRouteCount++;

  locationText.textContent =
    "🔄 Checking route...";

  if (offRouteCount >= 3) {

    const now =
      Date.now();

    if (
      now - lastRerouteTime >
      30000
    ) {

      lastRerouteTime = now;

      offRouteCount = 0;

      if (
        destinationLatitude !== null &&
        destinationLongitude !== null
      ) {

        locationText.textContent =
          "🔄 Recalculating route...";

        drawRoute(
          destinationLatitude,
          destinationLongitude
        );

      }

    }

  }

} else {

  offRouteCount = 0;

  locationText.textContent =
    "On route.";

}

}
  </script>

</body>
</html>
