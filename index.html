<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DriveThing GPS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .top {
      padding: 15px;
      background: #1c1c1c;
      text-align: center;
    }

    .top h1 {
      margin: 0;
      font-size: 26px;
    }

    .status {
      margin-top: 5px;
      color: #aaa;
    }

    #nextTurn {
      background: #1c1c1c;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: left;
    }

    #routeInfo {
      background: #222;
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 16px;
    }

    #map {
      height: 55vh;
      min-height: 350px;
      width: 100%;
    }

    .controls {
      padding: 15px;
      background: #1c1c1c;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      font-size: 17px;
      border-radius: 10px;
      border: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      background: white;
      color: #111;
    }

    .location {
      margin-top: 5px;
      color: #aaa;
      text-align: center;
      font-size: 14px;
    }

    body.light-mode {
      background: #f2f2f2;
      color: #111;
    }

    body.light-mode .top,
    body.light-mode .controls {
      background: white;
      color: #111;
    }

    body.light-mode #nextTurn {
      background: white;
      color: #111;
    }

    body.light-mode #routeInfo {
      background: #eee;
      color: #111;
    }

    body.light-mode .status,
    body.light-mode .location {
      color: #555;
    }

  </style>

</head>

<body>

  <div class="top">

    <h1>🚗 DriveThing GPS</h1>

    <div class="status">
      BridgeThing Navigation
    </div>

  </div>


  <div id="nextTurn">
    🧭 Next turn will appear here
  </div>


  <div id="routeInfo">
    Route information will appear here
  </div>


  <div id="map"></div>


  <div class="controls">

    <input
      id="destination"
      type="text"
      placeholder="🔎 Enter destination"
    >

    <button id="searchButton">
      🔎 Search Destination
    </button>

    <button id="gpsButton">
      📍 Get My Location
    </button>

    <button id="themeButton">
      ☀️ Light / 🌙 Dark
    </button>
    <button id="voiceButton">
  🔊 Voice Guidance: OFF
</button>

    <div
      class="location"
      id="location"
    >
      GPS location not available yet.
    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    /* MAP */

    const map =
      L.map("map").setView(
        [35.2271, -80.8431],
        10
      );


    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* VARIABLES */

    let currentMarker = null;

    let destinationMarker = null;

    let routeLine = null;

    let currentLatitude = null;

    let currentLongitude = null;

    let watchId = null;

    let routeSteps = [];
    let lastSpokenStep = -1;

    let currentStepIndex = 0;


    /* PAGE ELEMENTS */

    const gpsButton =
      document.getElementById("gpsButton");

    const searchButton =
      document.getElementById("searchButton");

    const themeButton =
      document.getElementById("themeButton");

    const destinationInput =
      document.getElementById("destination");

    const locationText =
      document.getElementById("location");

    const nextTurn =
      document.getElementById("nextTurn");

    const routeInfo =
      document.getElementById("routeInfo");


    /* THEME */

    themeButton.addEventListener(
      "click",
      function () {

        document.body.classList.toggle(
          "light-mode"
        );

      }
    );


    /* GPS BUTTON */

    gpsButton.addEventListener(
      "click",
      function () {

        getLocation();

      }
    );


    /* GET LOCATION */

    function getLocation() {

      if (!navigator.geolocation) {

        locationText.textContent =
          "GPS is not supported.";

        return;

      }


      locationText.textContent =
        "Finding your location...";


      navigator.geolocation.getCurrentPosition(

        function (position) {

          currentLatitude =
            position.coords.latitude;

          currentLongitude =
            position.coords.longitude;


          if (currentMarker) {

            map.removeLayer(
              currentMarker
            );

          }


          currentMarker =
            L.marker([
              currentLatitude,
              currentLongitude
            ])
            .addTo(map)
            .bindPopup(
              "You are here"
            );


          map.setView(
            [
              currentLatitude,
              currentLongitude
            ],
            15
          );


          locationText.textContent =
            "GPS location found.";


          startLiveGPS();

        },


        function (error) {

          locationText.textContent =
            "GPS error: " +
            error.message;

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /* LIVE GPS */

    function startLiveGPS() {

      if (!navigator.geolocation) {
        return;
      }


      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

      }


      watchId =
        navigator.geolocation.watchPosition(

          function (position) {

            currentLatitude =
              position.coords.latitude;

            currentLongitude =
              position.coords.longitude;
            checkNextTurn();


            if (currentMarker) {

              map.removeLayer(
                currentMarker
              );

            }


            currentMarker =
              L.marker([
                currentLatitude,
                currentLongitude
              ])
              .addTo(map)
              .bindPopup(
                "You are here"
              );

          },


          function (error) {

            locationText.textContent =
              "Live GPS error: " +
              error.message;

          },


          {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 10000
          }

        );

    }


    /* SEARCH DESTINATION */

    searchButton.addEventListener(
      "click",
      async function () {

        const destination =
          destinationInput.value.trim();


        if (!destination) {

          locationText.textContent =
            "Please enter a destination.";

          return;

        }


        locationText.textContent =
          "Searching for " +
          destination +
          "...";


        try {

          const response =
            await fetch(
              "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
              encodeURIComponent(
                destination
              )
            );


          const results =
            await response.json();


          if (results.length === 0) {

            locationText.textContent =
              "Destination not found.";

            return;

          }


          const place =
            results[0];


          const latitude =
            parseFloat(place.lat);

          const longitude =
            parseFloat(place.lon);


          map.setView(
            [
              latitude,
              longitude
            ],
            15
          );


          if (destinationMarker) {

            map.removeLayer(
              destinationMarker
            );

          }


          destinationMarker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map)
            .bindPopup(
              place.display_name
            )
            .openPopup();


          drawRoute(
            latitude,
            longitude
          );


        }

        catch (error) {

          locationText.textContent =
            "Search failed.";

        }

      }
    );


    /* DRAW ROUTE */

    async function drawRoute(
      destinationLatitude,
      destinationLongitude
    ) {


      if (
        currentLatitude === null ||
        currentLongitude === null
      ) {

        locationText.textContent =
          "First tap Get My Location.";

        return;

      }


      locationText.textContent =
        "Calculating route...";


      const routeURL =
        "https://router.project-osrm.org/route/v1/driving/" +
        currentLongitude +
        "," +
        currentLatitude +
        ";" +
        destinationLongitude +
        "," +
        destinationLatitude +
        "?overview=full&geometries=geojson&steps=true";


      try {

        const response =
          await fetch(routeURL);


        const data =
          await response.json();


        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          locationText.textContent =
            "No driving route found.";

          return;

        }


        const route =
          data.routes[0];


        routeSteps =
          route.legs[0].steps;


        currentStepIndex = 0;
        lastSpokenStep = -1;


        /* ROUTE LINE */

        if (routeLine) {

          map.removeLayer(
            routeLine
          );

        }


        routeLine =
          L.geoJSON(
            route.geometry
          ).addTo(map);


        map.fitBounds(
          routeLine.getBounds(),
          {
            padding: [30, 30]
          }
        );


        /* ROUTE INFO */

        const miles =
          (
            route.distance /
            1609.34
          ).toFixed(1);


        const minutes =
          Math.round(
            route.duration / 60
          );


        routeInfo.textContent =
          miles +
          " mi • " +
          minutes +
          " min";


        /* NEXT TURN */

        showNextTurn();
        if (voiceEnabled && routeSteps.length > 0) {
  speak("Starting navigation. " + getInstructionText(routeSteps[0]));
  lastSpokenStep = 0;
}


        locationText.textContent =
          "Route ready.";

      }


      catch (error) {

        locationText.textContent =
          "Unable to calculate route.";

      }

    }


    /* NEXT TURN */

    function showNextTurn() {

      if (
        !routeSteps ||
        routeSteps.length === 0
      ) {

        nextTurn.textContent =
          "🧭 Continue on route";

        return;

      }


      const step =
        routeSteps[
          currentStepIndex
        ];


      const maneuver =
        step.maneuver;


      let instruction =
        "Continue";


      if (
        maneuver.type === "turn"
      ) {

        instruction =
          "Turn " +
          (maneuver.modifier || "") +
          " onto " +
          (step.name ||
            "the road");

      }


      else if (
        maneuver.type === "depart"
      ) {

        instruction =
          "Start on " +
          (step.name ||
            "the road");

      }


      else if (
        maneuver.type === "arrive"
      ) {

        instruction =
          "You have arrived";

      }


      else if (
        maneuver.type === "roundabout"
      ) {

        instruction =
          "Enter the roundabout";

      }


      const distanceFeet =
        step.distance *
        3.28084;


      let distanceText;


      if (distanceFeet >= 5280) {

        distanceText =
          (
            distanceFeet /
            5280
          ).toFixed(1) +
          " mi";

      }

      else {

        distanceText =
          Math.round(
            distanceFeet
          ) +
          " ft";

      }


      nextTurn.innerHTML =
        "🧭 " +
        instruction +
        "<br>" +
        "<span style='font-size:16px;font-weight:normal;'>" +
        distanceText +
        " to next maneuver" +
        "</span>";

    }

  function checkNextTurn() {

  if (
    !routeSteps ||
    routeSteps.length === 0 ||
    currentLatitude === null ||
    currentLongitude === null
  ) {
    return;
  }

  const step =
    routeSteps[currentStepIndex];

  if (!step) {
    return;
  }

  const turnLatitude =
    step.maneuver.location[1];

  const turnLongitude =
    step.maneuver.location[0];

  const distance =
    getDistanceFeet(
      currentLatitude,
      currentLongitude,
      turnLatitude,
      turnLongitude
    );

  if (distance < 100) {

  if (
    currentStepIndex <
    routeSteps.length - 1
  ) {

    currentStepIndex++;

    showNextTurn();

  }

  return;
}
    if (distance <= 500) {
      if (voiceEnabled) {
  speak(instruction);
}

  const maneuver =
    step.maneuver;

  let instruction =
    "Continue";

  if (maneuver.type === "turn") {

    instruction =
      "Turn " +
      (maneuver.modifier || "") +
      " onto " +
      (step.name || "the road");

  }

  else if (maneuver.type === "roundabout") {

    instruction =
      "Enter the roundabout";

  }

  else if (maneuver.type === "arrive") {

    instruction =
      "You have arrived";

  }

  nextTurn.innerHTML =
    "⚠️ " +
    instruction +
    "<br>" +
    "<span style='font-size:16px;font-weight:normal;'>" +
    Math.round(distance) +
    " ft</span>";
      if (
  voiceEnabled &&
  lastSpokenStep !== currentStepIndex
) {

  speak(
    instruction +
    " in " +
    Math.round(distance) +
    " feet"
  );

  lastSpokenStep =
    currentStepIndex;

}

}
}


function getDistanceFeet(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 20902260;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +
    Math.cos(
      lat1 * Math.PI / 180
    ) *
    Math.cos(
      lat2 * Math.PI / 180
    ) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}
 let voiceEnabled = false;

const voiceButton =
  document.getElementById("voiceButton");

voiceButton.addEventListener(
  "click",
  function () {

    voiceEnabled =
      !voiceEnabled;

    if (voiceEnabled) {

      voiceButton.textContent =
        "🔊 Voice Guidance: ON";

      speak("Voice guidance enabled.");

    } else {

      voiceButton.textContent =
        "🔇 Voice Guidance: OFF";

      speechSynthesis.cancel();

    }

  }
);


function speak(text) {

  if (!voiceEnabled) {
    return;
  }

  speechSynthesis.cancel();

  const message =
    new SpeechSynthesisUtterance(text);

  message.rate = 0.9;
  message.pitch = 1;

  speechSynthesis.speak(
    message
  );

} function getInstructionText(step) {

  const maneuver = step.maneuver;

  if (maneuver.type === "turn") {
    return "Turn " +
      (maneuver.modifier || "") +
      " onto " +
      (step.name || "the road");
  }

  if (maneuver.type === "depart") {
    return "Start on " +
      (step.name || "the road");
  }

  if (maneuver.type === "arrive") {
    return "You have arrived";
  }

  if (maneuver.type === "roundabout") {
    return "Enter the roundabout";
  }

  return "Continue on route";
} </script>

</body>
</html>
