<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveThing GPS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .top {
      padding: 18px;
      background: #1c1c1c;
    }

    .top h1 {
      margin: 0;
      font-size: 28px;
    }

    .status {
      margin-top: 6px;
      color: #aaa;
    }

    #map {
      height: 60vh;
      min-height: 350px;
      width: 100%;
    }

    .controls {
      padding: 18px;
      background: #1c1c1c;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      background: white;
      color: #111;
    }

    .location {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }
 body.light-mode {
  background: #f2f2f2;
  color: #111;
}

body.light-mode .top {
  background: #ffffff;
}

body.light-mode .controls {
  background: #ffffff;
}

body.light-mode .status,
body.light-mode .location {
  color: #555;
} </style>
</head>

<body>

  <div class="top">
    <h1>🚗 DriveThing GPS</h1>
    <div class="status">BridgeThing Navigation</div>
  </div>

 <div id="nextTurn" style="
  background:#1c1c1c;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  text-align:left;
">
  🧭 Next turn will appear here
</div> <div id="map"></div>


  <div class="controls">
   <button id="themeButton" style="margin-bottom:10px;">
  ☀️ Light / 🌙 Dark
</button> 
    <button id="gpsButton">
      📍 Get My Location
    <input
  id="destination"
  type="text"
  placeholder="🔎 Enter destination"
  style="width:100%; padding:16px; margin-bottom:10px; font-size:18px; border-radius:10px; border:0;"
>

<button id="searchButton">
  🔎 Search Destination
</button>
    </button>

    <div class="location" id="location">
      GPS location not available yet.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([35.2271, -80.8431], 10);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let currentMarker = null;
    let currentLatitude = null;
let currentLongitude = null;
    let destinationMarker = null;

    const gpsButton = document.getElementById("gpsButton");
    const searchButton =
  document.getElementById("searchButton");

const destinationInput =
  document.getElementById("destination");
    const locationText = document.getElementById("location");

    gpsButton.addEventListener("click", function () {

      if (!navigator.geolocation) {
        locationText.textContent =
          "GPS is not supported by this browser.";
        return;
      }

      locationText.textContent =
        "Finding your location...";

      navigator.geolocation.getCurrentPosition(

        function (position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          currentLatitude = latitude;
currentLongitude = longitude;

          map.setView([latitude, longitude], 16);

          if (currentMarker) {
            map.removeLayer(currentMarker);
          }

          currentMarker = L.marker([
            latitude,
            longitude
          ]).addTo(map);

          currentMarker
            .bindPopup("You are here")
            .openPopup();

          locationText.textContent =
            "GPS location found.";
        },

        function (error) {

          locationText.textContent =
            "GPS error: " + error.message;
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );
    });

searchButton.addEventListener("click", async function () {

  const destination =
    destinationInput.value.trim();

  if (!destination) {
    locationText.textContent =
      "Please enter a destination.";
    return;
  }

  locationText.textContent =
    "Searching for " + destination + "...";

  try {

    const response = await fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(destination)
    );

    const results = await response.json();

    if (results.length === 0) {
      locationText.textContent =
        "Destination not found.";
      return;
    }

    const place = results[0];

    const latitude =
      parseFloat(place.lat);

    const longitude =
      parseFloat(place.lon);

    map.setView(
      [latitude, longitude],
      15
    );

    if (destinationMarker) {
      map.removeLayer(destinationMarker);
    }

    destinationMarker =
      L.marker([latitude, longitude])
        .addTo(map)
        .bindPopup(place.display_name)
        .openPopup();
    drawRoute(latitude, longitude);

    locationText.textContent =
      "Destination found.";

  } catch (error) {

    locationText.textContent =
      "Search failed. Please try again.";

  }

});
  async function drawRoute(destinationLatitude, destinationLongitude) {

  if (currentLatitude === null || currentLongitude === null) {
    locationText.textContent =
      "First tap Get My Location.";
    return;
  }

  locationText.textContent =
    "Calculating route...";

  const routeURL =
    "https://router.project-osrm.org/route/v1/driving/" +
    currentLongitude + "," + currentLatitude +
    ";" +
    destinationLongitude + "," + destinationLatitude +
    "?overview=full&geometries=geojson&steps=true";

  try {

    const response = await fetch(routeURL);
    const data = await response.json();

    if (!data.routes || data.routes.length === 0) {
      locationText.textContent =
        "No driving route found.";
      return;
    }

    const route = data.routes[0];
    const steps = route.legs[0].steps;

const nextTurn =
  document.getElementById("nextTurn");

if (steps.length > 0) {

  const maneuver = steps[0].maneuver;

let instruction = "Continue";

if (maneuver.type === "turn") {
  instruction =
    "Turn " + (maneuver.modifier || "") +
    " onto " + (steps[0].name || "the road");
}

else if (maneuver.type === "depart") {
  instruction =
    "Start on " + (steps[0].name || "the road");
}

else if (maneuver.type === "arrive") {
  instruction =
    "You have arrived at your destination";
}

else if (maneuver.type === "roundabout") {
  instruction =
    "Enter the roundabout";
}

  const distanceFeet =
  steps[0].distance * 3.28084;

let distanceText;

if (distanceFeet >= 5280) {
  distanceText =
    (distanceFeet / 5280).toFixed(1) +
    " mi";
} else {
  distanceText =
    Math.round(distanceFeet) +
    " ft";
}

nextTurn.innerHTML =
  "🧭 " + instruction +
  "<br><span style='font-size:16px; font-weight:normal;'>" +
  distanceText +
  " to next maneuver</span>";
}

    if (window.routeLine) {
      map.removeLayer(window.routeLine);
    }

    window.routeLine =
      L.geoJSON(route.geometry).addTo(map);

    map.fitBounds(
      window.routeLine.getBounds(),
      { padding: [30, 30] }
    );

    const miles =
      (route.distance / 1609.34).toFixed(1);

    const minutes =
      Math.round(route.duration / 60);

    locationText.textContent =
      miles + " miles • " +
      minutes + " minutes";

  } catch (error) {

    locationText.textContent =
      "Unable to calculate route.";

  }
}
 const themeButton =
  document.getElementById("themeButton");

themeButton.addEventListener("click", function () {

  document.body.classList.toggle("light-mode");

}); </script>

</body>
</html>
